app = "james-dainard-ai-mentor"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  OPENAI_MODEL = "gpt-4o"
  # Must stay text-embedding-3-small — the documents table was embedded with it.
  # The app refuses to boot on anything else (assertRuntimeConfig).
  EMBEDDING_MODEL = "text-embedding-3-small"
  ALLOWED_ORIGINS = "https://preacademy.app.clientclub.net"

# Secrets (fly secrets set ...): OPENAI_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
